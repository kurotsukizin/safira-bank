<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Safira Bank | Login</title><link rel="stylesheet" href="css/style.css"><script src="js/app.js" defer></script></head>
<body><a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a><header class="cabecalho-app"><div class="container cabecalho-conteudo"><a class="marca-app" href="index.html" aria-label="Safira Bank"><span class="icone-marca" aria-hidden="true">S</span><span>Safira Bank</span></a></div></header>
<main id="conteudo" class="container conteudo-app" tabindex="-1"><div class="faixa-demonstracao">Protótipo acadêmico · Dados fictícios · Sem operações reais</div><noscript><p>Ative o JavaScript para utilizar este protótipo.</p></noscript><div class="area-login"><section class="cartao cartao-login" aria-labelledby="titulo-login"><p class="sobretitulo">BEM-VINDO</p><h1 id="titulo-login">Acesse sua conta</h1><p class="texto-secundario">Informe seu e-mail e sua senha para continuar.</p><form id="form-login" class="formulario-login" method="post"><div class="campo"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" required></div><div class="campo"><label for="senha">Senha</label><div class="grupo-senha"><input id="senha" name="senha" type="password" autocomplete="current-password" required><button id="alternar-senha" class="alternar-senha" type="button" aria-controls="senha" aria-label="Mostrar senha" aria-pressed="false">Mostrar</button></div></div><p id="mensagem-login" class="mensagem-login" role="status" aria-live="polite" aria-atomic="true"></p><button class="botao botao-primario" type="submit">Entrar</button></form></section></div></main><footer class="rodape-app"><div class="container">Safira Bank · Projeto acadêmico · Ambiente de demonstração</div></footer></body></html>
